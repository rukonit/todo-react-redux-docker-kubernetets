apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-redux
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-redux
  template:
    metadata:
      labels:
        app: todo-redux
    spec:
      containers:
        - name: todo-redux
          image: todo-redux
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80